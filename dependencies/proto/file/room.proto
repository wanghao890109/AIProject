// //导致变化的原因
enum MicroChangeType {
	MCT_NONE = 0;
	MCT_USER_ON_MIC  = 1;   //用户上麦，刷新两个麦位的 状态和动作
	MCT_USER_OFF_MIC = 2;  //用户下麦，或管理员踢麦，刷新cur的状态和动作
	MCT_MGR_SET_MIC  = 3;   //管理员设置，刷新cur的状态和动作
	MCT_INVITE_ON_MIC = 4; //邀请上麦，管理员抱麦，刷新 新麦的状态
}

message MicroChange {
	int32 ctype 	= 1; //变化类型
	int64 serialno  = 2; //麦位序列号
	RoomMicro old   = 3; //变化前一麦位信息，ChangeOne，不刷新area, seat 可能为0， 表示没有原位置
	RoomMicro cur   = 4; //变化后一麦位信息，一定有area, seat, state 不一定有人，如果是封闭麦的情况，上麦才有人
	RoomMicro oper  = 5; //操作者信息
	repeated RoomMicro micros = 6; //操作后全新的麦位信息，端上刷新即可
}

message RoomChange {
	RoomBase   rbase    = 1; //房间基础信息
	RoomMicroS micros   = 2; //房间麦位信息
}

//操控游戏
message MgrOperGame {
	int32 optype 	= 1; //操作类型 GameOperType
	int64 roomId    = 2; //操作对应的房间
	int64 gameId    = 3; //对应的游戏 
	//string opdesc = 4; //操作文案
	//UserBase oper = 5; //操作者信息
}

//在房间内被操作
message MgrOperOnMe {
	int32 optype 	= 1; //操作类型 RoomOperType
	string opdesc   = 2; //操作文案
	UserBase oper   = 5; //操作者信息
}

//被操作的类型
enum RoomOperType {
	OT_UNDEFINE       = 0;    //未初始化，默认为开麦状态
	OT_MIC_OPENING 	  = 1;    //麦状态，开麦
	OT_MIC_SLIENCE    = 2;    //麦状态，静音，关闭
	OT_MIC_CLOSED     = 3;    //麦状态，封麦
	OT_MIC_INVITED    = 6;    //被邀请上麦
	OT_MIC_KICKED     = 7;    //被踢下麦
	OT_ROOM_KICKED    = 8;    //被踢出房间
	OT_CHAT_BANNED    = 11;   //公屏禁言
	OT_CHAT_ALLOWED   = 12;   //允许公屏
	OT_MANAGER_SET    = 16;   //被设为管理员
	OT_MANAGER_UNSET  = 17;   //被取消管理员
}

//被操作的类型
enum GameOperType {
	OT_UNKNOW       = 0;    //未初始化
	OT_LUNCH_GAME 	= 1;    //拉起游戏，首次拉起
	OT_START_GAME   = 2;    //开始游戏，开始一局游戏
	OT_END_GAME     = 3;    //结束游戏，结束当局游戏
	OT_CLOSE_GAME   = 4;    //关闭游戏，回到直播模式
}

//匹配游戏/直播房
message RoomMatch {
	int32    liveChan = 1; // 选填，匹配一个直播频道房
	int32    gameChan = 2; // 选填，匹配一个游戏频道房
}

