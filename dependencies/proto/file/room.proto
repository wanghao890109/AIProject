syntax = "proto3";
package haiyaa;
import "game.proto";
import "user.proto";
option java_package = "com.hao.proto";
option go_package   = "svr/public/proto/haiyaa";

//房间摘要
message RoomItem {
	uint64   roomId    = 1;    // 房间Id
	string   roomName  = 2;    // 名称
	int32    liveChan  = 3;    // 直播频道Id
	string   chanName  = 4;    // 频道名
	string   coverUrl  = 5;    // 背景  
	int32    memCount  = 6;    // 成员数量
	RoomUser owner     = 7;	   //   
	int32    swLock    = 8;    // 锁房状态，0未锁，1锁房
}
message RoomItemS {
	repeated RoomItem rooms  = 1; //推荐房间列表
}

//房间设置字符串类的设置，以#开头，比如设置密码为123，则传密码"#123", 取消密码，传"#", 如果是""表示无需操作
message RoomBase {
	uint64   roomId    = 1;    // 房间Id = OwnerUid
	string   roomName  = 2;    // 名称
	int32    roomMode  = 3;    // 房间模式 enum RoomMode {1 直播, 2游戏}
	int32    gameChan  = 4;    // 游戏频道Id
	int32    liveChan  = 5;    // 直播频道Id
	string   chanName  = 6;    // 频道名
	string   bgurl     = 7;    // 背景  
	int32    microMode = 8;    // 麦位模式, 麦位数量
	string   topic     = 21;   // 主题
	string   coverurl  = 22;   // 封面  
	string   notice    = 24;   // 公告  
	string   passwd    = 25;   // 锁密码 
	string   welcome   = 26;   // 欢迎语
	int32    canTalk   = 31;   // 公屏 default : 1, 开 
	int32    swLock    = 33;   // 没用到。忽略。加锁 0 表示默认关 1 表示开
	int64    ctTime    = 41;   // 创建时间
	int64    upTime    = 42;   // 修改时间
}

message RoomInfo {
	RoomBase   rbase    = 1; //房间基础信息
	RoomMicroS micros   = 2; //房间麦位信息
	RoomGame   game     = 3; //房间游戏
	RoomStatic static   = 4; //房间统计
	RoomManager manager = 5; //管理员列表
}
message RoomInfoS {
	repeated RoomInfo rooms = 1;
}

// 房间中的统计数据
message RoomStatic {
	uint64  roomId   = 1; // 房间Id
	int32   curNum   = 2; // 当前人数
	int32   curHot   = 3; // 当前热度
	int32	hotRank  = 4; // 热度排名
}

message RoomManager {
	repeated UserBase ubase = 1;
}

// 房间中的麦位实现
message RoomMicro { 
	uint64  roomId   = 1;   // 房间Id
	uint64  userId   = 2;   // 用户id
	int32   microId  = 3;   // 麦位Id, 0-MaxMicro表示在麦上
	int32   microState = 4; // 麦克状态, 0 无状态   1 开麦   2 闭麦静音 3 封麦 MicroState
	int32   roomRole = 5;   // 房间角色, 0 普通成员 1 麦上   2 管理员   3 房主
	UserBase user    = 6;   // 用户头像，未必有, 如果是麦位状态变化，也忽略麦上人的因素
}
message RoomMicroS {
	uint64   roomId   = 1; // 房间Id
	repeated RoomMicro micros = 2;
	int64 serialno  = 3; //麦位序列号
}

message RoomBg
{
	string  url        = 1;//图片地址
	string  name       = 2;//如果图片有名字
}

//房间状态
message RoomState {
	uint64   roomId    = 1; // 房间Id
	int32    roomMode  = 2; // 房间模式
	int32    gameChan  = 3; // 游戏频道
	int32    liveChan  = 4; // 直播频道
	int32    gamerNum  = 5; // 游戏人数
}

//房间模式
enum RoomMode {
    RM_UNDEFINE     = 0;  //未初始化，默认为普通状态
	RM_LIVE	    	= 1;  //房间直播模式
	RM_GAME      	= 2;  //房间游戏模式
}
enum MicroState {
    MS_UNDEFINE     = 0;  //未初始化，默认为开麦状态
	MS_OPENING 	    = 1;  //麦状态，开麦
	MS_SLIENCE      = 2;  //麦状态，静音，关闭
	MS_CLOSED       = 3;  //麦状态，封麦
}

//麦位模式
enum MicroMode {
    MM_UNDEFINE     = 0;  //未初始化，默认为普通状态
	MM_MICRO1	    = 1;  //房间单麦模式, 1个主播麦
	MM_MICRO2      	= 2;  //房间双麦模式, 2个麦
	MM_MICRO4      	= 4;  //房间4麦模式, 1+4 = 5个麦
	MM_MICRO8      	= 8;  //房间8麦模式, 1+8 = 9个麦
	MM_MICRO16      = 16;  //房间16麦模式, 暂未用到
}

enum RoomRole {
	RR_VISITER = 0; //听众
	RR_SPEAKER = 1; //麦上
	RR_MANAGER = 2; //管理员
	RR_OWNER   = 3; //房主
}

message RoomUid {
	uint64 roomId   = 1; // 房间Id
	uint64 userId   = 2; // UserId
}

message RoomUidS {
	uint64   roomId   = 1; // 房间Id
	repeated uint64 userIds = 2;
}

// 用户尝试进入加锁的房间
message JoinRoom {
	uint64  roomId  = 1;  // 房间Id
	string  passwd  = 2;  // 锁密码
}

message RoomUser {
	uint64  roomId   = 1;   // 房间Id
	uint64  userId   = 2;   // 用户id
	int32   microId  = 3;   // 麦位Id, 0-MaxMicro 表示在麦上
	int32   roomRole = 5;   // 房间角色, Enum RoomRole
	UserBase user    = 6;   // 用户头像，未必有, 如果是麦位状态变化，也忽略麦上人的因素
}
message RoomUserS {
	int32    total  = 1;
	int32    mgrNum = 2;
	repeated RoomUser users = 3;
}

//只有现房间，表明是进入，只有原房间，说明是退出，有两个，说明是跳房
message RoomInOut {
	uint64  userId      = 1; // 用户id
	uint64  oldRoomId   = 2; // 原房间Id
	uint64  newRoomId   = 3; // 现房间Id
}

// 房间中的麦上表情
message MicroFace {
	uint64  roomId   = 1; // 房间Id
	uint64  userId   = 2; // 用户id
	int32   faceId   = 3; // 表情id
	int32   micoId   = 4; // 麦位Id
}

//导致变化的原因
enum MicroGameType {
	MGT_NONE 	 = 0;
	MGT_YING_BI  = 1;   //硬币 [0-2)，
	MGT_CAI_QUAN = 2;   //猜拳 [0-3)，
	MGT_TOU_ZI   = 3;   //骰子 [0-6)，
	MGT_MAI_XU   = 4;   //麦序 [0-8)， 大麦个数
	MGT_LAO_HU   = 5;   //老虎 [0-999]
	MGT_RAND_IN  = 6;   //区间随机 [a-b]
}

// 房间中的麦上表情
message MicroGame {
	uint64  roomId   = 1; // 房间Id
	uint64  userId   = 2; // 用户id
	int32   gameId   = 3; // 表情id
	int32	micoId   = 5; // MicroId
	int32   result   = 6; // 结果
	UserBase user    = 7; // 用户头像
	int32   minRand  = 8; // 自定义随机区间
	int32   maxRand  = 9; // 自定义随机区间
}

// 房间中的频道列表
message RoomChan {
	int32    chanId   = 1; // 频道Id，标签Id
	string   chanName = 2; // 频道名
	string   chanIcon = 3; // Icon地址
}
message RoomChanS {
	repeated RoomChan chans = 1;
	int32    defaultChan    = 2; //Room 优先显示的ChannelId
}

// UserQuery
message RoomCreatePage {
	repeated RoomChan chans = 1;
}

// 房间中的频道列表
message RoomCreate {
	int32    liveChan = 1; // 必填
	int32    gameChan = 2; // 选填
	string   roomName = 3; // 必填，房名
	string   roomPwd  = 4; // 选填，房间密码，无则不填
}

// 房间访问记录, 进房记录
message RoomVisit {
	uint64  userId   = 1;  // 用户id
	uint64  roomId   = 2;  // 当前所在房间，是否在房
	int64   visitTime = 3; // 访问时间
	UserBase user    = 4;  // 用户头像，未必有, 如果是麦位状态变化，也忽略麦上人的因素
}

message RoomVisitS {
	uint64   roomId   		  = 1; // 房间Id
	repeated RoomVisit visits = 2;
}

